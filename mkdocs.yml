site_name: Python Testing Mastery Path
site_description: A structured, module-wise software testing training program using Python — manual QA fundamentals through advanced test automation.
site_url: https://sigilipelli.github.io/python-testing-mastery-path/
repo_url: https://github.com/SIGILIPELLI/python-testing-mastery-path
repo_name: python-testing-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is Software Testing?": level-1/01-what-is-software-testing.md
      - "02 · Test Case Design & Documentation": level-1/02-test-case-design.md
      - "03 · Test Types & Levels": level-1/03-test-types-levels.md
      - "04 · Defect Lifecycle & Bug Reporting": level-1/04-defect-lifecycle.md
      - "05 · Manual Testing in Practice": level-1/05-manual-testing-practice.md
      - "06 · Python Setup for Testers": level-1/06-python-setup.md
      - "07 · pytest Fundamentals": level-1/07-pytest-fundamentals.md
      - "08 · pytest Fixtures & Parametrize": level-1/08-fixtures-parametrize.md
      - "09 · Selenium WebDriver Basics": level-1/09-selenium-basics.md
      - "10 · Project — Test Plan + Automated Suite": level-1/10-project-test-suite.md
  - "Level 2 · Intermediate":
